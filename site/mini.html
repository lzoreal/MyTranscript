<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyTranscript</title>
<style>
  /* 迷你窗（桌面壳专用）：自己不放音频，只把按钮 emit 给主窗，主窗把状态 emit 回来。
     窗口本身无边框、置顶、不占任务栏，所以这里整块当标题栏用（顶部可拖）。
     主题令牌由主窗随状态推过来（theme 字段），迷你窗不再写死一套深色。 */
  :root{
    --bg:#16181d; --pane:#1d2026; --line:#2a2e36;
    --fg:#e7e9ee; --muted:#8f959f; --accent:#8ab4ff;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--fg);
    font:12px/1.4 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    -webkit-user-select:none;user-select:none;overflow:hidden;
    border:1px solid var(--line);
  }
  .strip{height:20px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;color:var(--muted)}
  .strip .brand{font:600 10px/1 var(--sans,inherit);letter-spacing:.08em;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .strip .acts{display:flex;align-items:center;gap:2px;flex:0 0 auto}
  .strip button{border:0;background:transparent;color:var(--muted);width:22px;height:16px;border-radius:4px;font-size:11px;cursor:pointer;display:grid;place-items:center}
  .strip button:hover{background:#d13438;color:#fff}
  .strip #capToggle{width:24px;font-size:10px;letter-spacing:0}
  .strip #capToggle:hover{background:var(--pane);color:var(--fg)}
  .strip #capToggle[aria-pressed="false"]{opacity:.55}
  .main{display:flex;gap:10px;align-items:center;padding:2px 10px 4px}
  .cover{width:44px;height:44px;flex:0 0 auto;border-radius:6px;overflow:hidden;background:var(--pane);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
  .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .txt{min-width:0;flex:1 1 auto}
  .txt strong{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .txt small{display:block;margin-top:2px;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ctl{display:flex;align-items:center;gap:3px;padding:5px 10px 0}
  .ctl button{
    flex:1 1 auto;height:26px;border:1px solid transparent;border-radius:6px;
    background:transparent;color:var(--fg);font-size:11px;cursor:pointer;
  }
  .ctl button:hover{background:var(--pane);border-color:var(--line)}
  .ctl button:disabled{opacity:.35;cursor:default}
  .ctl .play{font-size:13px;background:var(--pane);border-color:var(--line);font-weight:600}
  .foot{display:flex;align-items:center;gap:8px;padding:6px 10px 8px;color:var(--muted);font-size:10px}
  .foot span{flex:0 0 auto;font-variant-numeric:tabular-nums}
  .track{position:relative;flex:1 1 auto;height:10px;display:flex;align-items:center;cursor:pointer}
  .track::before{content:"";position:absolute;left:0;right:0;height:3px;border-radius:2px;background:var(--line)}
  .fill{position:relative;height:3px;border-radius:2px;background:var(--accent);width:0}
  .empty .txt strong{color:var(--muted);font-weight:500}
  /* 字幕区：跟着播放位置走，句间停顿保持上一句；实时识别开启时显示识别输出。 */
  .cap{padding:3px 10px 0;border-top:1px solid var(--line);margin-top:3px;min-width:0}
  .cap[hidden]{display:none}
  .cap .tag{display:inline-block;margin-right:5px;font-size:9px;letter-spacing:.08em;color:var(--accent);vertical-align:1px}
  .cap .tag[hidden]{display:none}
  .cap .en{
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
    color:var(--fg);font:12.5px/1.4 "Segoe UI","Microsoft YaHei",sans-serif;
  }
  .cap .zh{
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
    margin-top:2px;color:var(--muted);font:11px/1.4 "Segoe UI","Microsoft YaHei",sans-serif;
  }
  .cap .zh[hidden]{display:none}
  .cap.dim .en{color:var(--muted)}
</style>
</head>
<body>
  <div class="strip" data-tauri-drag-region="">
    <span class="brand" data-tauri-drag-region="">MyTranscript</span>
    <div class="acts">
      <button id="capToggle" title="显示文字稿" aria-label="显示文字稿" aria-pressed="true">字</button>
      <button id="close" title="关闭迷你窗" aria-label="关闭迷你窗">✕</button>
    </div>
  </div>
  <div class="main">
    <div class="cover" id="cover"><span id="initials">M</span></div>
    <div class="txt">
      <strong id="title" title="拖动这里移动窗口" data-tauri-drag-region="">未在播放</strong>
      <small id="meta" data-tauri-drag-region=""></small>
    </div>
  </div>
  <div class="cap" id="cap" hidden aria-live="polite">
    <div class="en"><span class="tag" id="capTag" hidden>LIVE</span><span id="capEn"></span></div>
    <div class="zh" id="capZh" hidden></div>
  </div>
  <div class="ctl">
    <button id="seekb" title="后退 15 秒" aria-label="后退 15 秒">−15s</button>
    <button id="prev" title="上一集" aria-label="上一集">‹</button>
    <button id="play" class="play" title="播放" aria-label="播放">▶</button>
    <button id="next" title="下一集" aria-label="下一集">›</button>
    <button id="seekf" title="前进 30 秒" aria-label="前进 30 秒">+30s</button>
  </div>
  <div class="foot">
    <span id="pos">0:00</span>
    <div class="track" id="track"><div class="fill" id="fill"></div></div>
    <span id="dur">0:00</span>
  </div>
<script>
(function () {
  const T = window.__TAURI__;
  const $ = (id) => document.getElementById(id);
  if (!T || !T.event) return;
  try { T.core.invoke('dbg_note', { msg: location.href + ' els=' + document.body.childElementCount }); } catch (e) {}

  const emit = (payload) => { try { T.event.emit('myt://mini-cmd', payload); } catch (e) {} };
  const CAP_KEY = 'myt-mini-cap';
  let capOn = true;
  try { capOn = localStorage.getItem(CAP_KEY) !== '0'; } catch (e) {}
  let lastState = null, lastFit = 0, lastTheme = '';
  function applyFit() {
    // 有字幕时窗口长高到能放下两句英文 + 两句中文，关掉字幕再缩回播放条高度。
    const want = capOn && lastState && lastState.cap ? 188 : 132;
    if (want === lastFit) return;
    lastFit = want;
    try { T.core.invoke('mini_fit', { height: want }); } catch (e) {}
  }
  // 主窗把当前主题的 6 个令牌一起推过来，迷你窗只做赋值，不猜主题名。
  function applyTheme(t) {
    if (!t) return;
    const key = [t.bg, t.panel, t.ink, t.muted, t.accent, t.line, t.scheme].join('|');
    if (key === lastTheme) return;
    lastTheme = key;
    const r = document.documentElement.style;
    if (t.bg) r.setProperty('--bg', t.bg);
    if (t.panel) r.setProperty('--pane', t.panel);
    if (t.ink) r.setProperty('--fg', t.ink);
    if (t.muted) r.setProperty('--muted', t.muted);
    if (t.accent) r.setProperty('--accent', t.accent);
    if (t.line) r.setProperty('--line', t.line);
    document.documentElement.dataset.scheme = t.scheme || 'dark';
  }
  function syncCapToggle() {
    const b = $('capToggle');
    b.setAttribute('aria-pressed', capOn ? 'true' : 'false');
    b.title = capOn ? '隐藏文字稿' : '显示文字稿';
    b.setAttribute('aria-label', b.title);
  }
  syncCapToggle();
  $('capToggle').onclick = () => {
    capOn = !capOn;
    try { localStorage.setItem(CAP_KEY, capOn ? '1' : '0'); } catch (e) {}
    syncCapToggle();
    render(lastState);
  };
  $('play').onclick = () => emit({ cmd: 'toggle' });
  $('prev').onclick = () => emit({ cmd: 'prev' });
  $('next').onclick = () => emit({ cmd: 'next' });
  // 步长由主窗随状态推过来，迷你窗不自己写死一份；主窗改了这里跟着变。
  $('seekb').onclick = () => emit({ cmd: 'seekRel', value: -(lastState?.steps?.back || 15) });
  $('seekf').onclick = () => emit({ cmd: 'seekRel', value: (lastState?.steps?.fwd || 30) });
  $('close').onclick = () => { try { T.core.invoke('close_mini'); } catch (e) {} };
  $('track').onclick = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    if (!rect.width) return;
    const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    emit({ cmd: 'seekTo', value: ratio });
  };

  const fmt = (t) => {
    if (!isFinite(t) || t <= 0) return '0:00';
    const total = Math.floor(t);
    const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(s).padStart(2, '0');
  };

  function initialsOf(name) {
    return (name || '').split(/[^A-Za-z0-9\u4e00-\u9fa5]+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || 'M';
  }

  let coverFor = '';
  function render(s) {
    lastState = s || null;
    if (s && s.theme) applyTheme(s.theme);
    const empty = !s || s.empty || !s.title;
    document.body.classList.toggle('empty', empty);
    $('title').textContent = empty ? '未在播放' : s.title;
    $('meta').textContent = empty ? '回到主窗口选一集' : (s.meta || '');
    const playing = !empty && !!s.playing;
    $('play').textContent = playing ? '❚❚' : '▶';
    $('play').title = playing ? '暂停' : '播放';
    $('play').setAttribute('aria-label', playing ? '暂停' : '播放');
    $('prev').disabled = empty || !s.canPrev;
    $('next').disabled = empty || !s.canNext;
    $('seekb').disabled = empty;
    $('seekf').disabled = empty;
    if (s && s.steps) {
      const back = s.steps.back || 15, fwd = s.steps.fwd || 30;
      $('seekb').textContent = '−' + back + 's';
      $('seekf').textContent = '+' + fwd + 's';
      $('seekb').title = '后退 ' + back + ' 秒';
      $('seekf').title = '前进 ' + fwd + ' 秒';
    }
    const dur = empty ? 0 : (s.dur || 0);
    const pos = empty ? 0 : (s.pos || 0);
    $('pos').textContent = fmt(pos);
    $('dur').textContent = fmt(dur);
    $('fill').style.width = (dur > 0 ? Math.min(100, pos / dur * 100) : 0) + '%';

    const cap = (!empty && capOn && s.cap) ? s.cap : '';
    const zh = cap ? (s.capZh || '') : '';
    $('cap').hidden = !cap;
    $('capEn').textContent = cap;
    $('capTag').hidden = !cap || !s.capLive;
    $('capZh').hidden = !zh;
    $('capZh').textContent = zh;
    applyFit();

    const key = empty ? '' : (s.cover || '');
    if (key !== coverFor) {
      coverFor = key;
      const box = $('cover');
      if (key) {
        box.innerHTML = '<img src="' + key.replace(/"/g, '%22') + '" alt="" referrerpolicy="no-referrer">';
        const img = box.querySelector('img');
        img.onerror = () => { box.innerHTML = '<span>' + initialsOf(s.meta) + '</span>'; };
      } else {
        box.innerHTML = '<span>' + initialsOf(s.meta) + '</span>';
      }
    }
  }

  render(null);
  let lastKey = '';
  T.event.listen('myt://mini-state', (ev) => {
    const p = ev.payload || null;
    const key = (p && p.title ? p.title + '|' + p.playing + '|' + Math.round(p.pos || 0) : 'empty');
    if (key !== lastKey) {
      lastKey = key;
      try { T.core.invoke('dbg_note', { msg: 'state ' + JSON.stringify(p).slice(0, 110) }); } catch (e) {}
    }
    render(p);
  });
})();
</script>
</body>
</html>
