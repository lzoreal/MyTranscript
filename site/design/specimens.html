<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>六张印刷品大样 · MyTranscript</title>
<style>
/* ============ 0. 公共 ============ */
:root{
  --serif: Georgia, "Songti SC", "Noto Serif SC", "Source Han Serif SC", serif;
  --serif-cn: "Songti SC", "Noto Serif SC", Georgia, serif;
  --sans: "Segoe UI Variable Display", "Segoe UI", system-ui, "Microsoft YaHei", sans-serif;
  --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:#22221f;color:#ddd}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased}

/* 纸纹：用细密噪点，避免"纯色塑料感" */
.grain{
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,.014) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.01) 0 1px, transparent 1px 4px);
}

.bar{
  position:fixed;left:50%;bottom:18px;translate:-50% 0;z-index:50;
  display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;
  background:rgba(24,24,21,.92);border:1px solid rgba(255,255,255,.14);
  box-shadow:0 18px 40px -20px rgba(0,0,0,.8);backdrop-filter:blur(8px);
  font:11px/1 var(--mono);color:#cfcdc4;letter-spacing:.08em;
}
.bar button{
  appearance:none;border:1px solid transparent;background:transparent;color:#cfcdc4;
  font:11px/1 var(--mono);letter-spacing:.06em;padding:7px 9px;border-radius:6px;cursor:pointer;
  white-space:nowrap;flex:0 0 auto;
}
.bar button:hover{background:rgba(255,255,255,.08)}
.bar button.on{background:#e8e4d6;color:#1c1b18;border-color:#e8e4d6}
.bar .sep{width:1px;height:16px;background:rgba(255,255,255,.18);margin:0 4px}

.wall{display:grid;grid-template-columns:repeat(2,1fr);gap:26px;padding:26px 26px 96px}
.wall .sheet{zoom:.52}
.wall .cap{margin:8px 2px 0;font:10.5px/1.5 var(--mono);color:#8d8a80;letter-spacing:.06em}

.sheet{
  position:relative;width:1180px;height:880px;overflow:hidden;
  box-shadow:0 40px 90px -50px rgba(0,0,0,.85);
}
.single{display:flex;justify-content:center;padding:0 0 96px;background:#1b1b18}
.single .sheet{margin-top:0}

/* ============ 1. 独立杂志（Monocle 路线） ============ */
.m1{background:#f4f1e9;color:#1a1a17;font-family:var(--serif)}
.m1 .page{position:absolute;inset:0;padding:38px 54px 46px;display:flex;flex-direction:column}
.m1 .bar-top{display:flex;align-items:center;gap:14px;font-family:var(--sans);font-size:9.5px;
  letter-spacing:.26em;text-transform:uppercase;color:#6d6a5f}
.m1 .bar-top i{flex:1 1 auto;height:1px;background:#cfc9bb}
.m1 .body{flex:1 1 auto;display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:40px;margin-top:34px}
.m1 .left{display:flex;flex-direction:column}
.m1 .stats{margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid #cfc9bb;padding-top:13px}
.m1 .stats div{padding-right:14px}
.m1 .stats div+div{border-left:1px solid #ded8ca;padding-left:16px}
.m1 .stats b{display:block;font:400 26px/1 var(--serif);letter-spacing:-.01em;color:#1a1a17}
.m1 .stats span{display:block;margin-top:6px;font:400 8.5px/1.4 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:#8a8477}
.m1 .kicker{font-family:var(--sans);font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:#a8402a}
.m1 h1{font:400 96px/0.92 var(--serif);letter-spacing:-.03em;margin:14px 0 0}
.m1 h1 em{font-style:italic;display:block}
.m1 .standfirst{font:400 19px/1.7 var(--serif-cn);color:#2c2a24;margin:22px 0 0;max-width:30ch}
.m1 .cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:26px;font:400 12px/1.85 var(--serif-cn);color:#4a473d}
.m1 .toc{margin-top:auto;border-top:1px solid #cfc9bb;padding-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.m1 .toc h4{font-family:var(--sans);font-size:9px;letter-spacing:.24em;color:#8a8477;text-transform:uppercase;margin:0 0 6px}
.m1 .toc p{font:400 11.5px/1.6 var(--serif-cn);color:#4a473d;margin:0}
.m1 .toc b{font-family:var(--mono);font-size:10px;color:#a8402a;margin-right:6px}
.m1 figure{margin:0;display:flex;flex-direction:column}
.m1 figure img{width:372px;height:372px;object-fit:cover;filter:saturate(.92) contrast(1.02)}
.m1 figcaption{font:400 10px/1.6 var(--sans);color:#7c776a;letter-spacing:.04em;margin-top:9px}
.m1 .stack{margin-top:18px;border-top:1px solid #cfc9bb}
.m1 .stack li{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid #ded8ca;list-style:none}
.m1 .stack ul{margin:0;padding:0}
.m1 .stack .n{font:400 9px/1 var(--mono);color:#a8402a;width:16px;flex:0 0 16px}
.m1 .stack .t{font:400 12px/1.5 var(--serif-cn);color:#2c2a24;flex:1 1 auto}
.m1 .stack .d{font:400 9.5px/1 var(--mono);color:#8a8477}

/* ============ 2. 报纸头版（FT 路线） ============ */
.m2{background:#faf8f3;color:#14130f;font-family:var(--serif)}
.m2 .page{position:absolute;inset:0;padding:26px 44px 30px;display:flex;flex-direction:column}
.m2 .mast{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.m2 .mast h1{font:400 62px/1 var(--serif);letter-spacing:-.015em;margin:0}
.m2 .mast .side{text-align:right;font-family:var(--sans);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#6f6a5e;line-height:1.9;padding-bottom:6px}
.m2 .rule{height:3px;border-top:1px solid #14130f;border-bottom:1px solid #14130f;margin:12px 0 0}
.m2 .deck{display:flex;justify-content:space-between;font-family:var(--sans);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#6f6a5e;padding:7px 0 0;border-bottom:1px solid #d9d3c6}
.m2 .grid{flex:1 1 auto;display:grid;grid-template-columns:1.55fr 1fr 1fr;gap:0;margin-top:0;border-bottom:1px solid #d9d3c6}
.m2 .col{padding:16px 20px 12px;border-right:1px solid #d9d3c6}
.m2 .col:last-child{border-right:0}
.m2 .lead h2{font:400 11px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:#8a5a15;margin:0 0 8px}
.m2 .lead h3{font:400 40px/1.06 var(--serif);letter-spacing:-.015em;margin:0 0 10px}
.m2 .lead .byline{font-family:var(--sans);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#6f6a5e;margin-bottom:10px}
.m2 .lead .lede{font:400 12.5px/1.72 var(--serif-cn);color:#2a2822;columns:2;column-gap:18px;column-rule:1px solid #e2dcd0}
.m2 .kicker{font:400 10px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:#6f6a5e;padding-bottom:7px;border-bottom:1px solid #14130f;margin-bottom:9px;display:flex;justify-content:space-between}
.m2 .list{list-style:none;margin:0;padding:0}
.m2 .list li{padding:7px 0;border-bottom:1px solid #eee8dc}
.m2 .list .t{font:400 12px/1.45 var(--serif-cn);color:#1b1a16}
.m2 .list .m{font-family:var(--mono);font-size:9px;color:#807a6d;letter-spacing:.04em;margin-top:3px;display:flex;gap:10px}
.m2 .nums{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.m2 .ph{margin:14px 0 0}
.m2 .ph img{width:100%;height:150px;object-fit:cover;filter:grayscale(1) contrast(1.08)}
.m2 .ph figcaption{font:400 9px/1.5 var(--sans);color:#807a6d;letter-spacing:.04em;margin-top:5px}
.m2 .lead{display:flex;flex-direction:column}
.m2 .brief{margin:16px 0 0;padding-top:0}
.m2 .brief .bh{font:400 8.5px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:#807a6d;
  border-top:1px solid #14130f;padding-top:7px;margin-bottom:2px}
.m2 .brief li{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid #eee8dc;list-style:none}
.m2 .brief ul{margin:0;padding:0}
.m2 .brief .i{font:400 9px/1 var(--mono);color:#8a5a15;width:14px;flex:0 0 14px}
.m2 .brief .t{flex:1 1 auto;font:400 12px/1.4 var(--serif-cn);color:#1b1a16}
.m2 .brief .d{font:400 9px/1 var(--mono);color:#807a6d}
.m2 .num{border-top:2px solid #14130f;padding-top:7px}
.m2 .num b{display:block;font:400 30px/1 var(--serif);letter-spacing:-.02em}
.m2 .num span{font-family:var(--sans);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:#6f6a5e}
.m2 .foot{display:flex;justify-content:space-between;font-family:var(--mono);font-size:8.5px;color:#807a6d;letter-spacing:.1em;padding-top:8px}

/* ============ 3. 瑞士国际主义 ============ */
.m3{background:#f2f2f0;color:#111;font-family:var(--sans)}
.m3 .page{position:absolute;inset:0;padding:44px 48px 40px;display:flex;flex-direction:column}
.m3 .head{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid #111;padding-bottom:10px}
.m3 .head b{font:600 11px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase}
.m3 .head span{font:400 9px/1 var(--mono);letter-spacing:.18em;color:#666}
.m3 .hero{display:grid;grid-template-columns:repeat(12,1fr);gap:20px;margin-top:34px;align-items:end}
.m3 .num14{grid-column:1/4;font:400 168px/.82 var(--sans);letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.m3 .num14 small{display:block;font:400 9px/1 var(--mono);letter-spacing:.24em;color:#666;margin-top:14px}
.m3 .title{grid-column:4/10;font:600 52px/1.02 var(--sans);letter-spacing:-.03em}
.m3 .title em{font-style:normal;color:#e0311c}
.m3 .blurb{grid-column:10/13;font:400 11px/1.7 var(--serif-cn);color:#444}
.m3 .rule{height:6px;background:#e0311c;margin:26px 0 0}
.m3 .rows{flex:1 1 auto;display:grid;grid-template-columns:repeat(12,1fr);column-gap:46px;margin-top:16px;align-content:space-between}
.m3 .row{grid-column:span 6;display:grid;grid-template-columns:28px minmax(0,1fr) 66px 52px;gap:12px;align-items:baseline;
  border-bottom:1px solid #d6d6d2;padding:8px 0}
.m3 .row .i{font:400 9px/1 var(--mono);color:#999}
.m3 .row .t{font:400 17px/1.3 var(--sans);letter-spacing:-.01em}
.m3 .row .s{font:400 9px/1 var(--mono);color:#666;letter-spacing:.12em;text-transform:uppercase}
.m3 .row .d{font:400 10px/1 var(--mono);color:#666;text-align:right}
.m3 .row.live .t:before{content:"";display:inline-block;width:7px;height:7px;background:#e0311c;margin-right:9px;vertical-align:1px}
.m3 .foot{display:flex;justify-content:space-between;font:400 8.5px/1 var(--mono);letter-spacing:.16em;color:#777;border-top:1px solid #111;padding-top:8px}

/* ============ 4. 影集 / 画册 ============ */
.m4{background:#15140f;color:#ece7da}
.m4 .page{position:absolute;inset:0;display:grid;grid-template-columns:716px minmax(0,1fr)}
.m4 .plate{position:relative;display:flex;flex-direction:column;border-right:1px solid #2b2920}
.m4 .plate .fig{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
.m4 .plate .fig img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.14) brightness(.9)}
.m4 .plate .fig:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,20,15,.28),rgba(21,20,15,.05) 40%,rgba(21,20,15,.55))}
.m4 .cap{flex:0 0 auto;position:static;background:#15140f;border-top:1px solid #3a3728;padding:16px 34px 20px}
.m4 .cap .k{font:400 9px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:#c8b98f}
.m4 .cap h1{font:400 34px/1.1 var(--serif);letter-spacing:-.02em;margin:8px 0 0;color:#f6f1e2}
.m4 .cap p{font:400 10.5px/1.65 var(--serif-cn);color:#b3aa93;margin:6px 0 0;max-width:58ch;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m4 .side{padding:36px 34px 30px;display:flex;flex-direction:column;border-left:1px solid #2b2920}
.m4 .side .top{display:flex;justify-content:space-between;font:400 9px/1 var(--mono);letter-spacing:.2em;color:#8d866f}
.m4 .side h2{font:400 13px/1.4 var(--serif-cn);margin:26px 0 12px;color:#e3ddcb}
.m4 .side h2 span{display:block;font:400 8.5px/1 var(--sans);letter-spacing:.24em;color:#9a9179;margin-bottom:6px}
.m4 .meta{list-style:none;margin:18px 0 0;padding:10px 0 0;border-top:1px solid #3a3728}
.m4 .meta li{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid #26241b}
.m4 .meta span{font:400 8.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#8d866f}
.m4 .meta b{font:400 10.5px/1 var(--mono);color:#ddd6c2;font-weight:400}
.m4 .plates{list-style:none;margin:0;padding:0}
.m4 .plates li{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid #2b2920}
.m4 .plates .p{font:400 8.5px/1 var(--mono);color:#8d866f;width:34px;flex:0 0 34px}
.m4 .plates .n{font:400 12px/1.4 var(--serif-cn);color:#ddd6c2;flex:1 1 auto}
.m4 .plates img{width:34px;height:34px;object-fit:cover;filter:grayscale(1) brightness(.85)}
.m4 .side .foot{margin-top:auto;border-top:1px solid #2b2920;padding-top:12px;font:400 9px/1.7 var(--mono);color:#8d866f}

/* ============ 5. Riso 双色印刷 ============ */
.m5{background:#f6f2e9;color:#1b1b1b}
.m5 .page{position:absolute;inset:0;padding:40px 48px;display:flex;flex-direction:column}
.m5 .dots{position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,77,109,.55) 1px, transparent 1.3px);
  background-size:4px 4px;opacity:.18;mix-blend-mode:multiply}
.m5 .head{position:relative;display:flex;justify-content:space-between;align-items:center;font:400 9px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:#2e4bff}
.m5 .title{position:relative;margin:26px 0 0}
.m5 .title h1{font:700 86px/0.95 var(--sans);letter-spacing:-.045em;margin:0;position:relative;color:#1b1b1b}
.m5 .title h1:before,.m5 .title h1:after{content:attr(data-t);position:absolute;left:0;top:0;z-index:-1}
.m5 .title h1:before{color:#ff4d6d;translate:5px 4px;opacity:.9}
.m5 .title h1:after{color:#2e4bff;translate:-4px -5px;opacity:.55}
.m5 .sub{position:relative;display:flex;gap:14px;align-items:baseline;margin-top:12px}
.m5 .sub p{font:400 12.5px/1.7 var(--serif-cn);color:#39362f;max-width:52ch;margin:0}
.m5 .sub .tag{font:400 8.5px/1 var(--mono);letter-spacing:.18em;color:#fff;background:#ff4d6d;padding:4px 6px;text-transform:uppercase;align-self:flex-start}
.m5 .cards{position:relative;flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:30px;align-content:start;align-items:start}
.m5 .tail{margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;border-top:1px solid #1b1b1b;padding-top:12px}
.m5 .tail h5{font:400 8.5px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:#2e4bff;margin:0 0 6px}
.m5 .tail p{font:400 10.5px/1.7 var(--serif-cn);color:#39362f;margin:0}
.m5 .crop{position:relative;z-index:1;background:#fffdf6;padding:14px;display:flex;flex-direction:column;
  box-shadow:6px 6px 0 rgba(46,75,255,.16),-6px -6px 0 rgba(255,77,109,.14)}
.m5 .crop:before,.m5 .crop:after{content:"";position:absolute;width:10px;height:10px;border:1px solid #1b1b1b}
.m5 .crop:before{left:-6px;top:-6px;border-right:0;border-bottom:0}
.m5 .crop:after{right:-6px;bottom:-6px;border-left:0;border-top:0}
.m5 .crop img{width:100%;height:118px;object-fit:cover;filter:saturate(1.15) contrast(1.05)}
.m5 .crop .k{font:400 8px/1 var(--mono);letter-spacing:.18em;color:#2e4bff;margin:9px 0 5px;text-transform:uppercase}
.m5 .crop .t{font:400 14px/1.35 var(--serif-cn);color:#1b1b1b}
.m5 .crop .m{font:400 9px/1 var(--mono);color:#6b6659;margin-top:6px}
.m5 .foot{position:relative;display:flex;justify-content:space-between;font:400 8.5px/1 var(--mono);letter-spacing:.16em;color:#6b6659;border-top:1px solid #c9c2b1;padding-top:9px;margin-top:14px}

/* ============ 6. 文学期刊 / 诗页 ============ */
.m6{background:#f7f3e8;color:#24211c;font-family:var(--serif)}
.m6 .page{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center}
.m6 .runhead{width:100%;display:flex;justify-content:space-between;padding:24px 46px 0;font:400 8.5px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:#8f897a}
.m6 .col{width:560px;flex:1 1 auto;display:flex;flex-direction:column;padding:46px 0 0}
.m6 .k{font:400 9px/1 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:#a8402a}
.m6 h1{font:400 52px/1.12 var(--serif);letter-spacing:-.015em;margin:16px 0 0}
.m6 .by{font:italic 400 15px/1.6 var(--serif);color:#6d6759;margin-top:12px}
.m6 .txt{margin-top:20px;font:400 13px/1.95 var(--serif-cn);color:#33302a}
.m6 .txt.lead{margin-top:22px;font-size:14px;color:#2a2620}
.m6 .txt.lead b{font-weight:400;color:#a8402a;letter-spacing:.02em}
.m6 .rule{width:100%;height:1px;background:#d5cdbb;margin:30px 0 0}
.m6 .index{margin-top:auto;padding:22px 0 34px;width:560px;display:grid;grid-template-columns:1fr 1fr;gap:6px 32px}
.m6 .index a{
  display:flex;align-items:baseline;gap:8px;font:400 11.5px/1.6 var(--serif-cn);color:#33302a;
  text-decoration:none;border-bottom:1px dotted #c9c1af;padding-bottom:4px}
.m6 .index .n{font:400 8.5px/1 var(--mono);color:#a8402a}
.m6 .index .dots{flex:1 1 auto;border-bottom:0}
.m6 .index .pg{font:400 8.5px/1 var(--mono);color:#8f897a}
.m6 .folio{width:100%;display:flex;justify-content:space-between;padding:0 46px 22px;font:400 8.5px/1 var(--mono);color:#a8a294;letter-spacing:.14em}
</style>
</head>
<body>
<div id="stage"></div>

<div class="bar">
  <button data-go="all" class="on">整墙 0</button>
  <span class="sep"></span>
  <button data-go="1">1 独立杂志</button>
  <button data-go="2">2 报纸</button>
  <button data-go="3">3 瑞士网格</button>
  <button data-go="4">4 影集</button>
  <button data-go="5">5 Riso</button>
  <button data-go="6">6 文学期刊</button>
</div>

<script>
const SK = [
  {id:1, name:"独立杂志 · Monocle 路线"},
  {id:2, name:"报纸头版 · FT 路线"},
  {id:3, name:"瑞士国际主义 · 网格与大字"},
  {id:4, name:"影集 · 大图与图注"},
  {id:5, name:"Riso 双色印刷 · 套印错位"},
  {id:6, name:"文学期刊 · 诗页与目录"},
];

const clean = n => String(n || "").replace(/\s*\(Unofficial\).*/, "").replace(/\s*- Transcripts$/, "");
const dur = d => String(d || "").slice(0, 5);
const day = d => String(d || "").slice(5, 16);

let DATA = null;

fetch("../catalog.json").then(r => r.json()).then(c => {
  const deadArt = s => /69bxa002sazai6fq21aswycjmwvu/.test(String(s || ""));
  const shows = c.shows.map(s => ({
    slug: s.slug,
    name: clean(s.name),
    art: deadArt(s.artwork) ? FALLBACK_ART : (s.artwork || ""),
    n: s.episode_count || 0,
    eps: (s.latest || []).map(e => ({
      title: e.title || "",
      img: deadArt(e.img) ? FALLBACK_ART : (e.img || s.artwork || ""),
      dur: dur(e.duration),
      day: day(e.date),
      desc: String(e.description || "").replace(/<[^>]+>/g, "")
    }))
  }));
  DATA = shows;
  render("all");
});

function sheet(inner, cls) {
  return `<div class="sheet ${cls} grain">${inner}</div>`;
}

const FALLBACK_ART = "assets/adsp-cover.jpg";

function pic(src, fb) {
  const a = (src || fb || FALLBACK_ART).replace(/'/g, "%27");
  const b = (fb || FALLBACK_ART).replace(/'/g, "%27");
  const onerr = b && b !== a
    ? `this.onerror=null;this.src='${b}'`
    : `this.onerror=null;this.style.visibility='hidden'`;
  return `<img src="${a}" alt="" onerror="${onerr}">`;
}

const BUILD = {1: m1, 2: m2, 3: m3, 4: m4, 5: m5, 6: m6};

function render(which) {
  if (!DATA) return;
  const stage = document.getElementById("stage");
  if (which === "all") {
    stage.className = "wall";
    stage.innerHTML = SK.map(k => `<div><div>${BUILD[k.id](DATA)}</div><div class="cap">${k.id} · ${k.name}</div></div>`).join("");
    const z = Math.min(0.62, (stage.clientWidth - 84) / 2 / 1180);
    stage.querySelectorAll(".sheet").forEach(s => { s.style.zoom = z; });
  } else {
    stage.className = "single";
    const k = SK.find(x => String(x.id) === String(which));
    stage.innerHTML = `<div><div>${BUILD[k.id](DATA)}</div><div class="cap" style="text-align:center;margin-top:12px">${k.id} · ${k.name}</div></div>`;
  }
  document.querySelectorAll(".bar button[data-go]").forEach(b => b.classList.toggle("on", b.dataset.go === String(which)));
}

document.querySelector(".bar").addEventListener("click", e => {
  const b = e.target.closest("button[data-go]");
  if (!b) return;
  render(b.dataset.go);
});
addEventListener("keydown", e => {
  if (/^[1-6]$/.test(e.key)) render(e.key);
  if (e.key === "0") render("all");
});
