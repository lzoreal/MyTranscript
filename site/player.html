<script data-theme-prewarm>
/* 主题预热：主题选择都存在 localStorage，等 01 模块加载完再套，第一帧会先把默认主题画出来（看起来像「闪一下」）。
   这里在首次绘制前就按当前主题卡把对应的 CSS 挂上；后面 01 里再套一次是幂等的。 */
(function () {
  try {
    var FALLBACK = { brass: 'midnight', forest: 'midnight', oxblood: 'midnight', celadon: 'ledger', mist: 'paper' };
    var saved = localStorage.getItem('myt-theme');
    if (saved && FALLBACK[saved]) saved = FALLBACK[saved];
    if (!localStorage.getItem('myt-ui-ledger') && (!saved || saved === 'prototype')) saved = 'ledger';
    document.documentElement.dataset.theme = saved || 'ledger';
    var raw = localStorage.getItem('myt-theme-custom');
    if (!raw) return;
    var cfg = JSON.parse(raw);
    if (!cfg || !cfg.enabled || !Array.isArray(cfg.presets)) return;
    /* 首帧注入的必须是「当前这张主题卡」的 CSS。旧逻辑注入编辑器里上一次的草稿，
       切到海报墙这类包卡时，第一帧会先把别的主题画出来，就是启动闪一下的来源。 */
    var preset = cfg.presets.find(function (item) { return item && item.id === saved; });
    if (!preset || typeof preset.css !== 'string' || !preset.css.trim()) return;
    var style = document.createElement('style');
    style.id = 'ctStyle';
    style.textContent = preset.css;
    (document.head || document.documentElement).appendChild(style);
  } catch (e) {}
})();
</script>

     所以这段 markup 归 src/skeletons/base.html 管，别在本文件里补页面结构。 -->
<div id="shellMount"></div>
<script src="skeletons-defaults.js"></script>
<script>
/* 骨架引导：必须在 player.js（module，天然 defer）之前跑完，因为 00-runtime.js
   在模块顶层就抓 epList / transcript。放 body 末尾、不异步，才能保证节点先于绑定。
   ?skeleton=a|b|c 是变体预览开关；没有它就是 base，行为与引入骨架之前的页面完全一致。 */
(function () {
  var SKELETONS = window.MYT_SKELETONS || {};
  var id = 'base';
  try {
    var want = new URLSearchParams(location.search).get('skeleton') || '';
    if (SKELETONS[want]) id = want;
  } catch (e) {}
  var mount = document.getElementById('shellMount');
  if (mount) mount.innerHTML = SKELETONS[id] || SKELETONS.base || '';
  document.documentElement.dataset.skeleton = id;
  // 变体阶段关掉自定义主题（液态玻璃这类整包重排会盖住变体自己的版面），
  // 让变体按自己的配色被评判；base 不受影响，用户的自定义主题照旧生效。
  window.__MYT_SKIP_CUSTOM_THEME = id !== 'base';
  if (window.__MYT_SKIP_CUSTOM_THEME) {
    var ct = document.getElementById('ctStyle');
    if (ct) ct.remove();
  }
  if (id !== 'base') {
    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'variants/' + id + '.css';
    document.head.appendChild(link);
  }
})();
</script>
