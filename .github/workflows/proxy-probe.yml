name: Proxy Probe

# 只读探测：某个地区的代理池有多少、GeoIP 出口分布、能否拉到音频。
# 用来判断"把 PROXY_REGION 切到某地区"是否可行，不写仓库、不跑转写。
on:
  workflow_dispatch:
    inputs:
      region:
        description: "地区（两字母代码，如 au、cn）"
        default: "au"
      sample:
        description: "抽样个数（GeoIP + 音频各测这么多个）"
        default: "40"
      url:
        description: "音频地址（留空=一个 megaphone 样例）"
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 --timeout 60 --no-cache-dir -r requirements.txt

      - name: 探测代理池
        env:
          PROXY_REGION: ${{ github.event.inputs.region || 'au' }}
        run: |
          python scripts/probe_proxies.py \
            --region "${{ github.event.inputs.region || 'au' }}" \
            --sample "${{ github.event.inputs.sample || '40' }}" \
            --url "${{ github.event.inputs.url }}"
