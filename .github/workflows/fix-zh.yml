name: Fix Missing Chinese

# 离线补译：只重译“译文不含中文”的句子（模型偶尔把英文原文当译文返回），
# 补完重新发布受影响的节目。不动 ASR、时轴和其它字段。
#
# 逐节目“补译 → 发布 → 提交”：一个节目跑完就落盘提交，job 即使超时也不会丢掉
# 已完成的节目。翻译按 150 条跨集凑批（按集发请求会撞全局限速，1500+ 集要十几小时）。
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "只处理某个节目（留空=所有已迁移节目）"
        default: ""
      dry_run:
        description: "只统计、不翻译不发请求（填 1）"
        default: ""

permissions:
  contents: write

concurrency:
  group: fix-zh
  cancel-in-progress: false

env:
  GEMINI_MODELS: ${{ vars.GEMINI_MODELS || 'gemini-3.5-flash-lite, gemini-3.1-flash-lite' }}
  GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  # 只补少量句子，额度按天算；6 RPM 比管线快，但仍在每把 key 的安全范围内。
  GEMINI_RPM: "6"
  # 健康度文件名用 SHARD：给补译一个不存在的编号，避免和分片 0 抢同一个文件。
  SHARD: "90"
  SHARDS: "1"
  GEMINI_HEALTH_DIR: ${{ github.workspace }}/data/.key-health
  HF_ENDPOINT: https://hf-mirror.com
  TRANSLATE_BATCH_SIZE: "150"

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.MY_CUSTOM_PAT }}

      - uses: actions/checkout@v4
        with:
          ref: data
          path: data-repo
          token: ${{ secrets.MY_CUSTOM_PAT }}

      - name: 链接数据目录
        run: |
          rm -rf data json
          ln -s "$PWD/data-repo/data" data
          ln -s "$PWD/data-repo/json" json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install --retries 5 --timeout 60 --no-cache-dir -r requirements-transcribe.txt
          pip install --retries 5 --timeout 60 --no-cache-dir -r requirements.txt
          # spaCy 模型 wheel 偶发 504：重试四次再认输。
          ok=0
          for attempt in 1 2 3 4; do
            if python -m spacy download zh_core_web_sm; then ok=1; break; fi
            echo "spaCy 中文模型下载失败（第 ${attempt} 次），15 秒后重试"
            sleep 15
          done
          [ "$ok" = "1" ] || exit 1

      - name: 配置 git
        env:
          MY_PAT: ${{ secrets.MY_CUSTOM_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://${MY_PAT}@github.com/${GITHUB_REPOSITORY}.git"

      - name: 逐节目补译、发布并提交
        if: ${{ github.event.inputs.dry_run != '1' }}
        env:
          MY_PAT: ${{ secrets.MY_CUSTOM_PAT }}
          ONLY: ${{ github.event.inputs.slug }}
        run: |
          set -e
          slugs=$(python -c "import json;print(' '.join(s['slug'] for s in json.load(open('feeds.json',encoding='utf-8')) if s.get('publish')))")
          for slug in $slugs; do
            if [ -n "$ONLY" ] && [ "$ONLY" != "$slug" ]; then continue; fi
            [ -d "data/$slug" ] || continue
            echo "== $slug"
            python -u scripts/fix_zh.py --slug "$slug"
            python scripts/publish_site.py "$slug" --data-dir data --json-dir json
            # 先推 data 分支（词级 JSON），再推 main（站点与 progress）。
            data_paths=()
            [ -d "data-repo/data/$slug" ] && data_paths+=("data/$slug")
            [ -d "data-repo/json/$slug" ] && data_paths+=("json/$slug")
            if [ "${#data_paths[@]}" -gt 0 ]; then
              git -C data-repo remote set-url origin "https://${MY_PAT}@github.com/${GITHUB_REPOSITORY}.git"
              GIT_WORKTREE="$PWD/data-repo" GIT_PUSH_BRANCH=data bash scripts/git_push_retry.sh \
                "auto: fill missing Chinese ($slug) data" "${data_paths[@]}"
            fi
            paths="progress.json"
            [ -d "site/$slug" ] && paths="$paths site/$slug"
            bash scripts/git_push_retry.sh "auto: fill missing Chinese ($slug)" $paths
          done

      - name: 统计（dry-run）
        if: ${{ github.event.inputs.dry_run == '1' }}
        env:
          SLUG: ${{ github.event.inputs.slug }}
        run: python -u scripts/fix_zh.py --slug "$SLUG" --dry-run
