name: Auto Transcribe & Deploy Pages

on:
  schedule:
    - cron: '0 2 * * *'   # 每天 UTC 02:00
  workflow_dispatch:
    inputs:
      podcast_slug:
        description: '播客标识（如 how-we-made-your-mother）'
        required: true
        default: 'how-we-made-your-mother'
      feed_url:
        description: '播客 RSS 地址'
        required: true
        default: 'https://rss.amperwave.net/v2/feed/audacynetwork/hwmym'
      model:
        description: 'Whisper 模型'
        required: true
        default: 'base'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: 设置 BASE_URL
        run: |
          REPO_NAME=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f2)
          echo "BASE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/$REPO_NAME" >> $GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache ffmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: /usr/bin/ffmpeg
          key: ffmpeg-${{ runner.os }}-v1
  
      - name: Install ffmpeg (if cache miss)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 安装依赖
        run: |
          pip install faster-whisper feedparser requests lxml deep-translator

      - name: 运行转录
        env:
          PODCAST_SLUG: ${{ github.event.inputs.podcast_slug || 'default' }}
          FEED_URL: ${{ github.event.inputs.feed_url || 'https://rss.amperwave.net/v2/feed/audacynetwork/hwmym' }}
          WHISPER_MODEL: ${{ github.event.inputs.model || 'base' }}
        run: python scripts/transcribe.py

      - name: 提交状态与站点文件到 Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json site/
          git diff --quiet && git diff --staged --quiet || git commit -m "auto: update ${PODCAST_SLUG:-default} transcripts [skip ci]"
          git push

      - name: 上传 Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: transcribe
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4