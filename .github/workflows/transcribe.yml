name: Auto Transcribe

on:
  schedule:
    # 只转录 how-we-made-your-mother（自制字幕，不走抓取）。和 crawl 各自成组、可并行；
    # timeout 360 分钟，最晚 18:00 UTC 结束，仍在每天 19:00 UTC 的 translate 之前。
    - cron: "0 12 * * 1"

  workflow_dispatch:
    inputs:
      podcast_slug:
        description: "播客标识（如 how-we-made-your-mother）"
        required: true
        default: "how-we-made-your-mother"

      feed_url:
        description: "播客 RSS 地址"
        required: true
        default: "https://rss.amperwave.net/v2/feed/audacynetwork/hwmym"

      model:
        description: "Whisper 模型"
        required: true
        default: "base.en"

      gemini_model:
        description: "Gemini 翻译模型"
        required: true
        default: "gemini-3.5-flash-lite"

# 部署拆到 deploy.yml（由 push 触发），本 workflow 只需要写仓库。
permissions:
  contents: write

concurrency:
  group: "transcribe"
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_CUSTOM_PAT }}

      - name: 同步到远程最新
        run: |
          git fetch origin
          git checkout "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

      - name: 设置 BASE_URL
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo "BASE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache ffmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ffmpeg-static
          key: ffmpeg-static-${{ runner.os }}-v7

      - name: Download ffmpeg (if cache miss)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p ffmpeg-static
          tar -xf *.tar.xz -C ffmpeg-static --strip-components=2
          rm *.tar.xz

      - name: 添加 ffmpeg 到 PATH
        run: echo "${GITHUB_WORKSPACE}/ffmpeg-static" >> "$GITHUB_PATH"

      - name: 检查 ffmpeg
        run: ffmpeg -version

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-transcribe.txt

      - name: 检查 Gemini 配置
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ github.event.inputs.gemini_model || 'gemini-3.5-flash-lite' }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::请在仓库 Settings → Secrets and variables → Actions 中设置 GEMINI_API_KEY"
            exit 1
          fi
          echo "Gemini model: $GEMINI_MODEL"

      - name: 运行转录与翻译
        continue-on-error: true
        env:
          PODCAST_SLUG: ${{ github.event.inputs.podcast_slug || 'how-we-made-your-mother' }}
          FEED_URL: ${{ github.event.inputs.feed_url || 'https://rss.amperwave.net/v2/feed/audacynetwork/hwmym' }}
          WHISPER_MODEL: ${{ github.event.inputs.model || 'base.en' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ github.event.inputs.gemini_model || 'gemini-3.5-flash-lite' }}
          BASE_URL: ${{ env.BASE_URL }}
        run: python -u scripts/transcribe.py

      - name: 提交状态与站点文件到 Git
        env:
          MY_PAT: ${{ secrets.MY_CUSTOM_PAT }}
          PODCAST_SLUG: ${{ github.event.inputs.podcast_slug || 'how-we-made-your-mother' }}
        run: |
          git remote set-url origin "https://${MY_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          # 本 job 拥有 state.json、自己 slug 的 feed.xml/en 字幕和根 index.html；
          # zh/ 与 feed-zh.xml 是 translate 的产物，排除掉以免并发提交撞同一个文件。
          bash scripts/git_push_retry.sh "auto: update ${PODCAST_SLUG} transcripts" \
            state.json site \
            ':(exclude)site/*/transcripts/zh/**' \
            ':(exclude)site/*/feed-zh.xml' \
            ':(exclude)progress.json' \
            ':(exclude)translations.json'