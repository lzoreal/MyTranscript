name: Auto Transcribe & Deploy Pages

on:
  push:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      podcast_slug:
        description: '播客标识（如 how-we-made-your-mother）'
        required: true
        default: 'how-we-made-your-mother'
      feed_url:
        description: '播客 RSS 地址'
        required: true
        default: 'https://rss.amperwave.net/v2/feed/audacynetwork/hwmym'
      model:
        description: 'Whisper 模型'
        required: true
        default: 'base'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: 同步到远程最新
        run: |
          git fetch origin
          git checkout ${{ github.ref_name }}
          # 工作区干净时，直接快进；如有意外差异则放弃本地（此时还没生成文件，安全）
          git reset --hard origin/${{ github.ref_name }}

      - name: 设置 BASE_URL
        run: |
          REPO_NAME=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f2)
          echo "BASE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/$REPO_NAME" >> $GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache ffmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ffmpeg-static
          key: ffmpeg-static-${{ runner.os }}-v7

      - name: Download ffmpeg (if cache miss)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p ffmpeg-static
          tar -xf *.tar.xz -C ffmpeg-static --strip-components=2
          rm *.tar.xz

      - run: echo "${{ github.workspace }}/ffmpeg-static" >> $GITHUB_PATH
      - run: ffmpeg -version

      - name: 安装依赖
        run: |
          pip install faster-whisper feedparser requests lxml deep-translator

      - name: 运行转录
        env:
          PODCAST_SLUG: ${{ github.event.inputs.podcast_slug || 'how-we-made-your-mother' }}
          FEED_URL: ${{ github.event.inputs.feed_url || 'https://rss.amperwave.net/v2/feed/audacynetwork/hwmym' }}
          WHISPER_MODEL: ${{ github.event.inputs.model || 'base' }}
        run: python scripts/transcribe.py

      - name: 提交状态与站点文件到 Git
        env:
          MY_PAT: ${{ secrets.MY_CUSTOM_PAT }}  # 自定义秘钥名
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json site/
          git diff --quiet && git diff --staged --quiet || git commit -m "auto: update ${PODCAST_SLUG:-default} transcripts [skip ci]"
          # 关键：替换远程地址，注入 PAT（假设 origin 为 https 协议）
          git remote set-url origin https://${MY_PAT}@github.com/${GITHUB_REPOSITORY}.git
          git push

      - name: 上传 Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: transcribe
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4