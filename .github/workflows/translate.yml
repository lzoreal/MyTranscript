name: Translate to Chinese

on:
  schedule:
    # 每天北京时间凌晨 3 点（UTC 19:00）扫积压。
    - cron: "0 19 * * *"
  workflow_run:
    # crawl / transcribe 一成功就补一轮，当天新抓的新剧集不用等到第二天。
    # 注意 workflow_run 拿不到 inputs，脚本会走各自默认值。
    workflows:
      - "Crawl Transcripts"
      - "Auto Transcribe"
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      max_files:
        description: '本次最多翻译多少个 VTT 文件'
        required: false
        default: '10'
      model:
        description: 'Gemini 模型'
        required: false
        default: 'gemini-3.5-flash-lite'

# 部署拆到 deploy.yml（由 push 触发），本 workflow 只需要写仓库。
permissions:
  contents: write

concurrency:
  group: "translate"
  cancel-in-progress: false

jobs:
  translate:
    # 由 workflow_run 触发时，只在父运行成功之后才接着翻译。
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_CUSTOM_PAT }}

      - name: 同步到远程最新
        run: |
          git fetch origin
          git checkout ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}

      - name: 设置 BASE_URL
        run: |
          REPO_NAME=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f2)
          echo "BASE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/$REPO_NAME" >> $GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 运行 Gemini 翻译
        id: translate
        # A few episodes may exhaust retries while the rest complete.  Let the
        # workflow publish the successful output and cache before reporting it.
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ github.event.inputs.model || 'gemini-3.5-flash-lite' }}
          MAX_FILES: ${{ github.event.inputs.max_files || '10' }}
          # Bound prompt size; the script validates every returned cue and
          # retries only missing cues when a long response is incomplete.
          MAX_BATCH_CHARS: "30000"
          MAX_BATCH_BLOCKS: "100"
          RPM_LIMIT: "14"
          DAILY_REQUEST_LIMIT: "15000"
        run: python -u scripts/translate_vtt.py

      - name: 记录未完成的翻译
        if: steps.translate.outcome == 'failure'
        run: |
          echo "::warning::Some episodes failed after retries. Successful translations will still be published; rerun the workflow to retry the failed episodes."

      - name: 生成中文 Feed
        run: |
          python scripts/generate_zh_feed.py --base-url "${BASE_URL}"

      - name: 提交状态与站点文件到 Git
        env:
          MY_PAT: ${{ secrets.MY_CUSTOM_PAT }}
        run: |
          git remote set-url origin "https://${MY_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          # 本 job 拥有 translations.json、zh/ 字幕、feed-zh.xml；
          # state.json / progress.json / 根 index.html 属于另外两个 job，排除掉防止互相回退。
          # 提交信息不再带 [skip ci]：deploy.yml 靠 push 触发，中文站点要跟着上线。
          bash scripts/git_push_retry.sh "auto: translate to zh-CN" \
            translations.json site \
            ':(exclude)state.json' \
            ':(exclude)progress.json' \
            ':(exclude)site/index.html'

