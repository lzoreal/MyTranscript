name: Crawl Transcripts & Deploy Pages

on:
  schedule:
    # 每 20 分钟运行一次，每个播客各处理最多 10 集
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 同步到远程最新
        run: |
          git fetch origin
          git checkout ${{ github.ref_name }}
          # 工作区干净时，直接快进；如有意外差异则放弃本地（此时还没生成文件，安全）
          git reset --hard origin/${{ github.ref_name }}
          
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Whisper models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/whisper
            ~/.cache/huggingface
          key: whisper-models-${{ runner.os }}-${{ hashFiles('scripts/align.py') }}
          restore-keys: |
            whisper-models-${{ runner.os }}-

      - name: Install dependencies
        run: pip install requests lxml faster-whisper

      - name: Setup BASE_URL
        run: |
          REPO_NAME=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f2)
          echo "BASE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/$REPO_NAME" >> $GITHUB_ENV

      - name: Cache ffmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ffmpeg-static
          key: ffmpeg-static-${{ runner.os }}-v7

      - name: Download ffmpeg (if cache miss)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p ffmpeg-static
          tar -xf *.tar.xz -C ffmpeg-static --strip-components=2
          rm *.tar.xz


      - run: echo "${{ github.workspace }}/ffmpeg-static" >> $GITHUB_PATH
      - run: ffmpeg -version

      - name: Run scraper
        run: python scripts/scraper.py

      - name: Commit progress & site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add progress.json site/
          git diff --quiet && git diff --staged --quiet || git commit -m "auto: update transcripts [skip ci]"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: crawl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4