name: Crawl Transcripts

on:
  schedule:
    # 流水线第一步：抓取英文字幕。三个 workflow 各自成组、可以并行；这里的时间只是
    # 让数据依赖保持顺畅（translate 由 workflow_run 在本 workflow 成功后接着跑）。
    - cron: "0 5 * * 1"
  workflow_dispatch:

# 部署拆到 deploy.yml（由 push 触发），本 workflow 只需要写仓库。
permissions:
  contents: write

concurrency:
  group: "crawl"
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
            token: ${{ secrets.MY_CUSTOM_PAT }}
      - name: 同步到远程最新
        run: |
          git fetch origin
          git checkout ${{ github.ref_name }}
          # 工作区干净时，直接快进；如有意外差异则放弃本地（此时还没生成文件，安全）
          git reset --hard origin/${{ github.ref_name }}
          
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup BASE_URL
        run: |
          REPO_NAME=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f2)
          echo "BASE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/$REPO_NAME" >> $GITHUB_ENV

      - name: Run scraper
        run: python -u scripts/scraper.py

      - name: Commit progress & site
        env:
          MY_PAT: ${{ secrets.MY_CUSTOM_PAT }}  # 自定义秘钥名
        run: |
          git remote set-url origin "https://${MY_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          # 只暂存本 job 拥有的路径：zh/ 字幕、feed-zh.xml 和根 index.html 分属其它 job，
          # 顺手带上去会让并发提交撞上同一个文件。目录排除要写 /** ，裸目录名不排除内容。
          bash scripts/git_push_retry.sh "auto: update transcripts" \
            progress.json site \
            ':(exclude)site/*/transcripts/zh/**' \
            ':(exclude)site/*/feed-zh.xml' \
            ':(exclude)site/index.html' \
            ':(exclude)state.json' \
            ':(exclude)translations.json'