name: Transcript Pipeline

# 统一链路：RSS → 双语词级 JSON（写入 main 的 data/，站点由 publish job 写 site/）。
# 详见 docs/superpowers/specs/2026-10-30-unified-transcript-pipeline-design.md
on:
  workflow_dispatch:
    inputs:
      only_slug:
        description: "只跑某个节目（留空=全部）"
        default: ""
      shards:
        description: "分片数（每片一个 job，待办集平均分配）"
        default: "10"
      max_minutes:
        description: "每片预算（分钟，含已提交的分块）"
        default: "270"
      gemini_model:
        description: "翻译模型（留空=仓库变量 GEMINI_MODEL，再退回 gemini-3.1-flash-lite）"
        default: ""

permissions:
  contents: write

# 同一个 run 里的矩阵 job 各跑各的，这里只防止两次 dispatch 重叠。
concurrency:
  group: transcript-pipeline
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.gen.outputs.shards }}
    steps:
      - id: gen
        env:
          SHARDS: ${{ github.event.inputs.shards || '10' }}
        run: |
          echo "shards=$(python3 -c 'import json, os; print(json.dumps(list(range(int(os.environ["SHARDS"])))))')" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # 写死并发数：用表达式引用 inputs 时矩阵会展开成空，job 直接不生成。
      # 20 = 账号级并发上限；GEMINI_RPM 同步降到 2，20 片合计仍是 40 RPM。
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      DATA_DIR: ${{ github.workspace }}/data
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ github.event.inputs.shards || '10' }}
      MAX_MINUTES: ${{ github.event.inputs.max_minutes || '270' }}
      # 单集实测 35~40 分钟且不可中断；留够一集，每块提交才真的按集发生。
      RESERVE_MINUTES: "40"
      # 4 把 key、每把约 15 RPM；20 个分片各按 2 RPM 打，合计 40 RPM，留出余量。
      GEMINI_RPM: "2"
      # 各分片只写自己的健康度文件，读取时合并：一把 key 在某片被判死，其它片下一块就跳过。
      GEMINI_HEALTH_DIR: ${{ github.workspace }}/data/.key-health
      ONLY_SLUG: ${{ github.event.inputs.only_slug || '' }}
      # 换模型：dispatch 时传 gemini_model，或直接在仓库变量里改 GEMINI_MODEL，都不用推代码。
      GEMINI_MODEL: ${{ github.event.inputs.gemini_model || vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
      WHISPER_MODEL: models/ct2-turbo
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_ENDPOINT: https://hf-mirror.com
    steps:
      - uses: actions/checkout@v4
        with:
          # 排队的 run 会钉在创建时的 SHA；显式取 main 最新，否则上一轮
          # 分片提交的 state 看不到，会被重做。
          ref: main
          token: ${{ secrets.MY_CUSTOM_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # sentence-transformers 默认拉 CUDA 版 torch（3 GB+ 的 nvidia 依赖），runner 没有 GPU，
          # 磁盘会被撑爆。先装 CPU wheel，后续解析直接复用。
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements-transcribe.txt
          python -m spacy download zh_core_web_sm

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ${{ github.workspace }}/models/ct2-turbo
          key: pipeline-models-v1

      - name: 准备模型（缓存未命中时）
        run: |
          python - <<'PY'
          from pathlib import Path
          target = Path("models/ct2-turbo")
          if not (target / "model.bin").exists():
              from huggingface_hub import snapshot_download
              snapshot_download("deepdml/faster-whisper-large-v3-turbo-ct2", local_dir=str(target))
          from sentence_transformers import SentenceTransformer
          SentenceTransformer("paraphrase-multilingual-MiniLM-L12-v2")
          print("models ready")
          PY

      - name: 准备数据目录
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          [ -n "$(ls -A data)" ] || touch data/.gitkeep

      # 分块跑 + 分块提交：job 被掐断时只丢当前这一集，不像整片跑完再提交那样全丢。
      - name: 运行管线（每块提交）
        run: |
          set -o pipefail
          start=$(date +%s)
          budget=$(( ${MAX_MINUTES%.*} * 60 ))
          while :; do
            remaining=$(( budget - ( $(date +%s) - start ) ))
            if [ "$remaining" -lt 2700 ]; then
              echo "剩余 ${remaining}s 不足一集，收尾"
              break
            fi
            chunk=$(( remaining / 60 ))
            [ "$chunk" -gt 45 ] && chunk=45
            rc=0
            MAX_MINUTES=$chunk python -u scripts/run_pipeline.py || rc=$?
            bash scripts/git_push_retry.sh \
              "auto: word transcripts (shard ${SHARD})" data \
              || echo "提交失败，文件留在工作区等兜底步骤"
            if [ "$rc" -eq 3 ]; then
              echo "本片已无待处理集数"
              break
            fi
            if [ "$rc" -ne 0 ]; then
              echo "管线退出码 ${rc}（2=配额暂停），本片停止"
              break
            fi
          done

      - name: 提交产物到 main
        if: always()
        env:
          MY_PAT: ${{ secrets.MY_CUSTOM_PAT }}
        run: |
          git remote set-url origin "https://${MY_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          bash scripts/git_push_retry.sh \
            "auto: word transcripts (shard ${SHARD}, tail)" data

  # 分片全部跑完后统一发布：导出词级 JSON、重建 feed/index，一个节目只由一个 job 写。
  publish:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.MY_CUSTOM_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装发布依赖
        run: pip install -r requirements.txt

      - name: 发布已迁移节目
        run: |
          set -e
          for slug in $(python -c "import json;print(' '.join(s['slug'] for s in json.load(open('feeds.json',encoding='utf-8')) if s.get('publish')))"); do
            python scripts/publish_site.py "$slug" --data-dir data --json-dir json
          done

      - name: 提交站点文件
        env:
          MY_PAT: ${{ secrets.MY_CUSTOM_PAT }}
        run: |
          paths="progress.json"
          for s in $(python -c "import json;print(' '.join(s['slug'] for s in json.load(open('feeds.json',encoding='utf-8')) if s.get('publish')))"); do
            [ -d "site/$s" ] && paths="$paths site/$s"
            [ -d "json/$s" ] && paths="$paths json/$s"
          done
          git remote set-url origin "https://${MY_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          bash scripts/git_push_retry.sh "auto: publish migrated shows" $paths
