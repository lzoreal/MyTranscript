name: Transcript Pipeline

# 统一链路：RSS → 双语词级 JSON（写入 main 的 data/，站点由 publish job 写 site/）。
# 详见 docs/superpowers/specs/2026-10-30-unified-transcript-pipeline-design.md
on:
  workflow_dispatch:
    inputs:
      only_slug:
        description: "只跑某个节目（留空=全部）"
        default: ""
      shards:
        description: "分片上限（实际取 min(待办集数, 20, 本值)，待办平均分配）"
        default: "20"
      max_minutes:
        description: "每片预算（分钟，含已提交的分块）"
        default: "270"
      gemini_model:
        description: "翻译模型轮换表（逗号分隔；留空=仓库变量 GEMINI_MODELS，再退回 3.5/3.1 flash-lite）"
        default: ""
      translate_batch:
        description: "每次请求翻译的条数（配额按每天请求数计，调大最省额度）"
        default: "150"
      proxy_region:
        description: "下载代理的出口地区（两字母代码，逗号分隔；留空=cn，例如 au 或 cn,au）"
        default: ""

permissions:
  contents: write

# 同一个 run 里的矩阵 job 各跑各的，这里只防止两次 dispatch 重叠。
concurrency:
  group: transcript-pipeline
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.gen.outputs.shards }}
      count: ${{ steps.gen.outputs.count }}
      pending: ${{ steps.gen.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          sparse-checkout: |
            feeds.json
            scripts
          sparse-checkout-cone-mode: false

      - uses: actions/checkout@v4
        with:
          ref: data
          path: data-repo
          filter: blob:none
          sparse-checkout: |
            data/*/state*.json
          sparse-checkout-cone-mode: false

      - name: 链接数据目录
        run: |
          rm -rf data json
          ln -s "$PWD/data-repo/data" data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装判定依赖
        run: pip install --quiet feedparser requests

      - id: gen
        env:
          CAP: ${{ github.event.inputs.shards || '20' }}
          ONLY_SLUG: ${{ github.event.inputs.only_slug || '' }}
        run: python scripts/plan_shards.py --cap "$CAP" --only-slug "$ONLY_SLUG" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    if: needs.plan.outputs.pending != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # 写死并发数：用表达式引用 inputs 时矩阵会展开成空，job 直接不生成。
      # 20 = 账号级并发上限；GEMINI_RPM 同步降到 2，20 片合计仍是 40 RPM。
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      DATA_DIR: ${{ github.workspace }}/data
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ needs.plan.outputs.count }}
      MAX_MINUTES: ${{ github.event.inputs.max_minutes || '270' }}
      # 单集实测 35~40 分钟且不可中断；留够一集，每块提交才真的按集发生。
      RESERVE_MINUTES: "40"
      # 每把 key 约 15 RPM；20 个分片各按 2 RPM 打，合计 40 RPM，留出余量。
      GEMINI_RPM: "2"
      # 各分片只写自己的健康度文件，读取时合并：一把 key 在某个模型上被判死，
      # 其它片下一块就跳过那一个 (key, model) 桶。
      GEMINI_HEALTH_DIR: ${{ github.workspace }}/data/.key-health
      ONLY_SLUG: ${{ github.event.inputs.only_slug || '' }}
      # 日额度按 (key, model) 计：轮换表就是额度份数，全部用完这一片才暂停。
      # 换表：dispatch 时传 gemini_model（可逗号分隔），或在仓库变量 GEMINI_MODELS 里改，都不用推代码。
      GEMINI_MODELS: ${{ github.event.inputs.gemini_model || vars.GEMINI_MODELS || 'gemini-3.5-flash-lite, gemini-3.1-flash-lite' }}
      # 配额按"每天请求数"计：一次请求翻 3 倍，同一份额度就能多出 3 倍的集。
      TRANSLATE_BATCH_SIZE: ${{ github.event.inputs.translate_batch || '150' }}
      # 代理出口地区：默认 cn（无插播的中国区音频）；某些节目只能从别的地区取时改这里。
      PROXY_REGION: ${{ github.event.inputs.proxy_region || 'cn' }}
      WHISPER_MODEL: models/ct2-turbo
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_ENDPOINT: https://hf-mirror.com
    steps:
      - uses: actions/checkout@v4
        with:
          # 排队的 run 会钉在创建时的 SHA；显式取 main 最新，否则上一轮
          # 分片提交的 state 看不到，会被重做。
          ref: main
          token: ${{ secrets.MY_CUSTOM_PAT }}

      # 词级数据在 data 分支：检出到 data-repo，再把 data/、json/ 软链到根目录。
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data-repo
          token: ${{ secrets.MY_CUSTOM_PAT }}

      - name: 链接数据目录
        run: |
          rm -rf data json
          ln -s "$PWD/data-repo/data" data
          ln -s "$PWD/data-repo/json" json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # sentence-transformers 默认拉 CUDA 版 torch（3 GB+ 的 nvidia 依赖），runner 没有 GPU，
          # 磁盘会被撑爆。先装 CPU wheel，后续解析直接复用。
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install --retries 5 --timeout 60 --no-cache-dir -r requirements-transcribe.txt
          # spaCy 模型的 wheel 托管在 GitHub Releases，偶发 504：同一轮里 13/20 片曾卡死在这里。
          ok=0
          for attempt in 1 2 3 4; do
            if python -m spacy download zh_core_web_sm; then ok=1; break; fi
            echo "spaCy 中文模型下载失败（第 ${attempt} 次），15 秒后重试"
            sleep 15
          done
          [ "$ok" = "1" ] || exit 1

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ${{ github.workspace }}/models/ct2-turbo
          key: pipeline-models-v1

      - name: 准备模型（缓存未命中时）
        run: |
          python - <<'PY'
          from pathlib import Path
          target = Path("models/ct2-turbo")
          if not (target / "model.bin").exists():
              from huggingface_hub import snapshot_download
              snapshot_download("deepdml/faster-whisper-large-v3-turbo-ct2", local_dir=str(target))
          from sentence_transformers import SentenceTransformer
          SentenceTransformer("paraphrase-multilingual-MiniLM-L12-v2")
          print("models ready")
          PY

      - name: 准备数据目录
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          [ -n "$(ls -A data)" ] || touch data/.gitkeep

      # 分块跑 + 分块提交：job 被掐断时只丢当前这一集，不像整片跑完再提交那样全丢。
      - name: 运行管线（每块提交）
        run: |
          set -o pipefail
          start=$(date +%s)
          budget=$(( ${MAX_MINUTES%.*} * 60 ))
          while :; do
            remaining=$(( budget - ( $(date +%s) - start ) ))
            if [ "$remaining" -lt 2700 ]; then
              echo "剩余 ${remaining}s 不足一集，收尾"
              break
            fi
            chunk=$(( remaining / 60 ))
            [ "$chunk" -gt 45 ] && chunk=45
            rc=0
            MAX_MINUTES=$chunk python -u scripts/run_pipeline.py || rc=$?
            GIT_WORKTREE="$PWD/data-repo" GIT_PUSH_BRANCH=data bash scripts/git_push_retry.sh \
              "auto: word transcripts (shard ${SHARD})" data \
              || echo "提交失败，文件留在工作区等兜底步骤"
            if [ "$rc" -eq 3 ]; then
              echo "本片已无待处理集数"
              break
            fi
            if [ "$rc" -ne 0 ]; then
              echo "管线退出码 ${rc}（2=配额暂停），本片停止"
              break
            fi
          done

      - name: 提交产物到 main
        if: always()
        env:
          MY_PAT: ${{ secrets.MY_CUSTOM_PAT }}
        run: |
          git -C data-repo remote set-url origin "https://${MY_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          GIT_WORKTREE="$PWD/data-repo" GIT_PUSH_BRANCH=data bash scripts/git_push_retry.sh \
            "auto: word transcripts (shard ${SHARD}, tail)" data

  # 分片全部跑完后统一发布：导出词级 JSON、重建 feed/index，一个节目只由一个 job 写。
  publish:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.MY_CUSTOM_PAT }}

      - uses: actions/checkout@v4
        with:
          ref: data
          path: data-repo
          token: ${{ secrets.MY_CUSTOM_PAT }}

      - name: 链接数据目录
        run: |
          rm -rf data json
          ln -s "$PWD/data-repo/data" data
          ln -s "$PWD/data-repo/json" json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装发布依赖
        run: pip install -r requirements.txt

      - name: 发布已迁移节目
        run: |
          set -e
          for slug in $(python -c "import json;print(' '.join(s['slug'] for s in json.load(open('feeds.json',encoding='utf-8')) if s.get('publish')))"); do
            python scripts/publish_site.py "$slug" --data-dir data --json-dir json
          done

      - name: 提交词级 JSON（data 分支）
        env:
          MY_PAT: ${{ secrets.MY_CUSTOM_PAT }}
        run: |
          # 先推 data：feed 指向的 JSON 必须在站点更新前就绪。
          git -C data-repo remote set-url origin "https://${MY_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          GIT_WORKTREE="$PWD/data-repo" GIT_PUSH_BRANCH=data bash scripts/git_push_retry.sh \
            "auto: publish word transcripts" data json

      - name: 提交站点文件（main）
        env:
          MY_PAT: ${{ secrets.MY_CUSTOM_PAT }}
        run: |
          # 只暂存本次真正改过的节目；没改动的 feed 不重写、不提交。
          paths="progress.json"
          for dir in $(python scripts/changed_shows.py); do
            paths="$paths $dir"
          done
          git remote set-url origin "https://${MY_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          bash scripts/git_push_retry.sh "auto: publish migrated shows" $paths

      # 一轮做完还有待办就自己派下一轮；配额打空（本轮 0 产出）时停下，避免空转。
      - name: 链式派发下一轮
        env:
          MY_PAT: ${{ secrets.MY_CUSTOM_PAT }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ONLY_SLUG: ${{ github.event.inputs.only_slug || '' }}
          SHARDS: ${{ github.event.inputs.shards || '20' }}
          MAX_MINUTES: ${{ github.event.inputs.max_minutes || '270' }}
          GEMINI_MODEL_INPUT: ${{ github.event.inputs.gemini_model || '' }}
          TRANSLATE_BATCH_INPUT: ${{ github.event.inputs.translate_batch || '150' }}
          PROXY_REGION_INPUT: ${{ github.event.inputs.proxy_region || '' }}
        run: python scripts/chain_next.py
