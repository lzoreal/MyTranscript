<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyTranscript UI Prototype · 3 directions</title>
<style>
/* ============================================================
   THROWAWAY PROTOTYPE — 只用于比较 3 套桌面 UI 方向。
   不属于正式界面，不接持久化，不改 site/player.html。
   用法：index.html?variant=A&page=home
   ============================================================ */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{overflow:hidden;background:#111;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:#222}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
input{font:inherit}
a{color:inherit;text-decoration:none}
::selection{background:rgba(0,0,0,.12)}
html,body,*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0;height:0}
#stage{height:100vh;overflow:hidden}
.cover{position:relative;display:grid;place-items:center;overflow:hidden;border-radius:10px;color:#fff;isolation:isolate;flex:0 0 auto}
.cover:before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,rgba(255,255,255,.13),transparent 42%,rgba(0,0,0,.28))}
.cover span{position:relative;z-index:1;font-weight:900;letter-spacing:-.05em;line-height:.88;text-align:center}
.a-shell .cover span{font-size:22px}
.b-shell .cover span{font-size:36px}
.c-shell .cover span{font-size:44px}
.cv-hwmym{background:linear-gradient(140deg,#e6a43f,#c6542e)}
.cv-office{background:linear-gradient(140deg,#e9dcc7,#b78d72);color:#2b2118}
.cv-smart{background:linear-gradient(140deg,#111,#383838);border:1px solid #555}
.cv-invisible{background:linear-gradient(140deg,#f2ef48,#d6d300);color:#171700}
.cv-psych{background:linear-gradient(140deg,#8bb6e8,#4e77a5)}
.cv-99{background:#101010;color:#f3ef3f;border:1px solid #333}
.ptype{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
.tiny{font-size:11px;line-height:1.5}
.dotlive{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;vertical-align:1px;margin-right:7px}

/* ================= A · Studio Desk ================= */
.a-shell{
  --bg:#f1eee7;--panel:#fbf9f4;--panel2:#e9e4da;--ink:#1f1d18;--muted:#716b5f;--line:#ddd6c8;
  --accent:#2f6b5b;--accent-soft:#dfece6;--rail:#24231f;
  height:100vh;display:grid;grid-template-columns:68px minmax(0,1fr) 330px;background:var(--bg);color:var(--ink)
}
.a-rail{background:var(--rail);color:#e9e4d8;display:flex;flex-direction:column;align-items:center;padding:18px 0 16px;gap:8px}
.a-brand{width:38px;height:38px;border-radius:12px;background:#d8ff6a;color:#17180f;display:grid;place-items:center;font-weight:900;font-size:19px;margin-bottom:16px}
.a-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#a9a296;font-size:19px;position:relative}
.a-ic:hover,.a-ic.on{background:#37352e;color:#fff}
.a-ic.on:after{content:"";position:absolute;left:-14px;top:12px;width:3px;height:16px;border-radius:2px;background:#d8ff6a}
.a-rail-bottom{margin-top:auto;display:grid;gap:8px}
.a-avatar{width:32px;height:32px;border-radius:50%;background:#d8ff6a;color:#17180f;display:grid;place-items:center;font-weight:800;font-size:12px}
.a-main{display:flex;flex-direction:column;min-width:0}
.a-top{height:64px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 28px;border-bottom:1px solid var(--line);background:rgba(251,249,244,.72);backdrop-filter:blur(10px)}
.a-crumb{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.a-crumb strong{color:var(--ink);font-size:13px;font-weight:700}
.a-search{display:flex;align-items:center;gap:8px;width:250px;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--muted);font-size:12px}
.a-content{min-height:0;overflow:auto;padding:28px 34px 96px}
.a-kicker{font-size:10px;letter-spacing:.16em;color:var(--muted);font-weight:700}
.a-h1{font-size:34px;line-height:1.06;letter-spacing:-1.4px;margin:10px 0 22px;font-weight:800}
.a-continue{display:flex;gap:18px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);position:relative;overflow:hidden}
.a-continue:after{content:"";position:absolute;left:0;bottom:0;height:3px;width:44%;background:var(--accent)}
.a-continue .cover{width:86px;height:86px}
.a-continue-copy{min-width:0;flex:1}
.a-continue-copy h2{font-size:18px;line-height:1.25;letter-spacing:-.4px;margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-continue-copy p{margin:0;color:var(--muted);font-size:11.5px}
.a-continue-copy .a-prog{margin-top:12px;display:flex;align-items:center;gap:10px;font-size:10.5px;color:var(--muted)}
.a-track{height:4px;border-radius:99px;background:var(--panel2);flex:1;overflow:hidden}
.a-track i{display:block;height:100%;width:44%;background:var(--accent);border-radius:99px}
.a-play{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:19px;flex:0 0 auto}
.a-section{display:flex;align-items:flex-end;justify-content:space-between;margin:28px 0 10px}
.a-section h3{font-size:14px;margin:0;letter-spacing:-.2px}
.a-section button{font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.a-rows{display:grid;border-top:1px solid var(--line)}
.a-row{display:grid;grid-template-columns:42px 56px minmax(0,1fr) 84px 34px;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.a-row:hover{background:rgba(47,107,91,.05)}
.a-row .num{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.a-row .cover{width:44px;height:44px;border-radius:8px}
.a-row .copy{min-width:0}
.a-row .copy strong{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-row .copy span{display:block;color:var(--muted);font-size:10px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-row .dur{font-size:10.5px;color:var(--muted);text-align:right}
.a-row .mini-play{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--accent)}
.a-inspector{border-left:1px solid var(--line);background:var(--panel);padding:24px 22px 96px;overflow:auto}
.a-inspector .ptype{color:var(--muted)}
.a-ins-title{font-size:12px;font-weight:800;margin:8px 0 16px}
.a-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.a-stat{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.a-stat b{display:block;font-size:23px;line-height:1;letter-spacing:-1px}
.a-stat span{display:block;margin-top:5px;font-size:9px;color:var(--muted)}
.a-queue-head{display:flex;justify-content:space-between;margin:24px 0 8px;font-size:10px;color:var(--muted)}
.a-queue{display:grid;gap:2px}
.a-qrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.a-qrow .cover{width:34px;height:34px;border-radius:7px}
.a-qrow div{min-width:0}
.a-qrow strong{display:block;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-qrow span{display:block;font-size:9px;color:var(--muted)}
.a-note{margin-top:24px;padding:14px;border-radius:10px;background:var(--accent-soft);color:#2c4d43;font-size:10.5px;line-height:1.6}
.a-reader-top{padding:22px 34px 8px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);background:var(--panel)}
.a-reader-top .cover{width:64px;height:64px;border-radius:10px}
.a-reader-top div{min-width:0}
.a-reader-top h2{font-size:20px;letter-spacing:-.5px;margin:0 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-reader-top p{margin:0;color:var(--muted);font-size:11px}
.a-pill{margin-left:auto;padding:6px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:9px;font-weight:800;letter-spacing:.08em}
.a-transcript{overflow:auto;padding:20px 34px 130px;min-height:0;flex:1}
.a-line{display:grid;grid-template-columns:46px minmax(0,1fr);gap:12px;padding:11px 12px;border-left:2px solid transparent;border-radius:0 8px 8px 0;cursor:pointer}
.a-line:hover{background:rgba(47,107,91,.06)}
.a-line.on{border-left-color:var(--accent);background:var(--accent-soft)}
.a-line time{font-size:10px;color:var(--muted);padding-top:4px;font-variant-numeric:tabular-nums}
.a-line strong{display:block;font-size:15px;line-height:1.55;font-weight:600}
.a-line span{display:block;margin-top:4px;font-size:11.5px;line-height:1.6;color:var(--muted)}
.a-line.on strong{font-size:17px}
.a-ins-reader > .cover{width:100%;height:170px;border-radius:12px;margin-bottom:14px}
.a-controls{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0}
.a-controls button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px}
.a-controls .main{width:44px;height:44px;background:var(--accent);color:#fff;border:0;font-size:17px}
.a-time{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:8px}
.a-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.a-chip{padding:5px 8px;border:1px solid var(--line);border-radius:99px;font-size:9px;color:var(--muted)}

/* ================= B · Editorial Ledger ================= */
.b-shell{
  --bg:#f7f2e6;--paper:#fffaf0;--ink:#211d16;--muted:#6c6252;--line:#ded3bf;
  --accent:#a24f2a;--accent-soft:#f1dfd2;--nav:#26221b;--navmuted:#bdb2a2;
  height:100vh;display:grid;grid-template-columns:236px minmax(0,1fr);background:var(--bg);color:var(--ink)
}
.b-side{background:var(--nav);color:#f2e8d9;padding:24px 16px 18px;display:flex;flex-direction:column}
.b-brand{display:flex;align-items:center;gap:10px;padding:0 6px 26px}
.b-mark{width:34px;height:34px;border-radius:50%;border:1px solid #e8d8bf;display:grid;place-items:center;font-size:15px;color:#f0b288}
.b-brand strong{font-size:16px;letter-spacing:-.4px}
.b-brand span{display:block;font:9px/1.4 monospace;letter-spacing:.18em;color:var(--navmuted);margin-top:4px}
.b-label{font-size:9px;letter-spacing:.16em;color:var(--navmuted);margin:16px 8px 7px}
.b-nav{display:grid;gap:1px}
.b-nav button{display:flex;align-items:center;gap:10px;padding:9px 9px;border-radius:7px;color:var(--navmuted);font-size:11.5px;text-align:left}
.b-nav button:hover,.b-nav button.on{color:#fff7e9;background:rgba(255,255,255,.07)}
.b-nav button.on{border-left:2px solid #e0a06d}
.b-nav i{font-style:normal;width:16px;text-align:center;opacity:.8}
.b-side-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding:14px 7px 0;color:var(--navmuted);font-size:10px;line-height:1.6}
.b-main{min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.b-top{height:58px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 36px;border-bottom:1px solid var(--line);background:rgba(247,242,230,.85)}
.b-top .date{font:10px/1 monospace;letter-spacing:.14em;color:var(--muted)}
.b-top .links{display:flex;gap:18px;font-size:10px;color:var(--muted)}
.b-top .links b{color:var(--accent)}
.b-body{min-height:0;overflow:auto;padding:30px 44px 110px}
.b-mast{display:grid;grid-template-columns:1fr 240px;gap:30px;align-items:end;padding-bottom:24px;border-bottom:2px solid var(--ink)}
.b-mast h1{font-family:Georgia,"Songti SC","Noto Serif SC",serif;font-size:62px;line-height:.9;letter-spacing:-3px;margin:0}
.b-mast h1 em{font-style:normal;color:var(--accent)}
.b-mast p{margin:12px 0 0;max-width:520px;font-size:11.5px;line-height:1.7;color:var(--muted)}
.b-mast .b-editor{padding-left:20px;border-left:1px solid var(--line);font-size:10px;line-height:1.8;color:var(--muted)}
.b-search{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--ink);padding:8px 0;margin:20px 0 0;color:var(--muted);font-size:11px}
.b-feature{display:grid;grid-template-columns:180px minmax(0,1fr);gap:24px;padding:26px 0;border-bottom:1px solid var(--line);cursor:pointer}
.b-feature .cover{height:180px;width:180px;border-radius:2px}
.b-feature-copy{display:flex;flex-direction:column;justify-content:center;min-width:0}
.b-feature-copy .ptype{color:var(--accent)}
.b-feature-copy h2{font-family:Georgia,"Songti SC",serif;font-size:34px;line-height:1.06;letter-spacing:-1.2px;margin:8px 0 8px}
.b-feature-copy p{margin:0;color:var(--muted);font-size:11px;max-width:620px}
.b-feature-copy .b-rule{display:flex;align-items:center;gap:12px;margin-top:18px;font-size:10px;color:var(--muted)}
.b-feature-copy .b-rule .bar{width:180px;height:3px;background:var(--line);position:relative}
.b-feature-copy .b-rule .bar i{position:absolute;left:0;top:0;bottom:0;width:44%;background:var(--accent)}
.b-feature-copy .b-rule b{color:var(--ink)}
.b-sec{display:flex;justify-content:space-between;align-items:end;margin:28px 0 4px}
.b-sec h3{font-family:Georgia,"Songti SC",serif;font-size:22px;margin:0;letter-spacing:-.5px;font-weight:600}
.b-sec span{font-size:9px;letter-spacing:.12em;color:var(--muted)}
.b-table{width:100%;border-collapse:collapse;table-layout:fixed}
.b-table th{text-align:left;font-size:8px;letter-spacing:.12em;color:var(--muted);font-weight:600;padding:8px 0;border-bottom:1px solid var(--ink)}
.b-table td{padding:12px 0;border-bottom:1px solid var(--line);font-size:11px;vertical-align:middle}
.b-table tr{cursor:pointer}
.b-table tr:hover td{background:rgba(162,79,42,.05)}
.b-table .show{color:var(--accent);font-size:9px;letter-spacing:.04em}
.b-table .title{font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-top:3px}
.b-table .dur{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.b-table .prog{text-align:right;color:var(--muted);font-size:9px}
.b-shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:26px}
.b-book{display:flex;gap:12px;min-width:0}
.b-book .cover{width:64px;height:82px;border-radius:2px}
.b-book strong{display:block;font-family:Georgia,"Songti SC",serif;font-size:15px;line-height:1.2;margin:2px 0 4px}
.b-book span{display:block;font-size:9px;color:var(--muted);line-height:1.5}
.b-reader{min-height:0;display:grid;grid-template-columns:218px minmax(0,1fr) 250px;overflow:hidden;background:var(--bg)}
.b-series{border-right:1px solid var(--line);padding:24px 18px 100px;overflow:auto}
.b-series .ptype{color:var(--accent)}
.b-series h2{font-family:Georgia,"Songti SC",serif;font-size:25px;line-height:1.1;letter-spacing:-.8px;margin:9px 0 18px}
.b-ep{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.b-ep .n{font:9px/1.4 monospace;color:var(--muted);width:20px}
.b-ep strong{display:block;font-size:10.5px;line-height:1.35}
.b-ep span{display:block;font-size:9px;color:var(--muted);margin-top:2px}
.b-ep.on strong{color:var(--accent)}
.b-article{overflow:auto;padding:30px 38px 120px;min-width:0}
.b-article .kicker{font-size:9px;letter-spacing:.16em;color:var(--accent);font-weight:700}
.b-article h1{font-family:Georgia,"Songti SC",serif;font-size:38px;line-height:1.08;letter-spacing:-1.4px;margin:10px 0 10px}
.b-article .byline{font-size:10px;color:var(--muted);padding-bottom:16px;border-bottom:1px solid var(--ink)}
.b-article .b-lines{margin-top:10px}
.b-line{padding:12px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);cursor:pointer}
.b-line:first-child{border-top:0}
.b-line time{font:9px/1 monospace;color:var(--muted);letter-spacing:.04em}
.b-line p{margin:5px 0 0;font-size:14.5px;line-height:1.62;font-weight:500}
.b-line p.zh{margin-top:4px;font-size:10.5px;line-height:1.6;color:var(--muted);font-weight:400}
.b-line.on{padding-left:14px;border-left:3px solid var(--accent);background:var(--accent-soft)}
.b-line.on p{font-size:17px}
.b-margin{border-left:1px solid var(--line);padding:26px 22px 100px;overflow:auto}
.b-margin .ptype{color:var(--muted)}
.b-margin h3{font-family:Georgia,"Songti SC",serif;font-size:18px;margin:8px 0 14px}
.b-controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:18px}
.b-controls button{padding:8px 4px;border:1px solid var(--line);border-radius:4px;font-size:9px;color:var(--muted)}
.b-controls .main{grid-column:1/-1;background:var(--ink);color:var(--paper);font-size:11px;padding:11px}
.b-note{border-top:1px solid var(--line);padding:14px 0;font-size:10px;line-height:1.7;color:var(--muted)}
.b-note b{display:block;color:var(--ink);font-size:11px;margin-bottom:3px}

/* ================= C · Focus Cinema ================= */
.c-shell{
  --bg:#0b0d0c;--ink:#f4efe5;--muted:#a09a8d;--line:rgba(244,239,229,.14);
  --accent:#d9ff5f;--accent-ink:#151807;
  height:100vh;background:
    radial-gradient(1000px 500px at 75% -10%,rgba(217,255,95,.07),transparent 65%),
    radial-gradient(900px 700px at -10% 70%,rgba(255,106,74,.08),transparent 70%),
    var(--bg);
  color:var(--ink);overflow:hidden;position:relative
}
.c-top{position:relative;z-index:5;height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;border-bottom:1px solid var(--line)}
.c-brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.4px}
.c-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px rgba(217,255,95,.1)}
.c-top nav{display:flex;gap:24px;font-size:10px;letter-spacing:.12em;color:var(--muted)}
.c-top nav b{color:var(--ink)}
.c-home{padding:42px 42px 190px;overflow:auto;height:calc(100vh - 66px)}
.c-home .c-head{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:end;margin-bottom:28px}
.c-home .ptype{color:var(--accent)}
.c-home h1{font-size:58px;line-height:.92;letter-spacing:-2.8px;margin:13px 0 12px;max-width:620px}
.c-home h1 em{font-style:normal;color:var(--accent)}
.c-home p{max-width:480px;color:var(--muted);font-size:12px;line-height:1.7;margin:0}
.c-nowcard{display:grid;grid-template-columns:116px minmax(0,1fr);gap:16px;padding:16px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.045);align-self:end}
.c-nowcard .cover{width:116px;height:116px;border-radius:13px}
.c-nowcard div{min-width:0;display:flex;flex-direction:column;justify-content:center}
.c-nowcard .ptype{font-size:8px}
.c-nowcard h2{font-size:17px;line-height:1.25;margin:7px 0 8px;letter-spacing:-.4px}
.c-nowcard .c-meter{height:4px;background:rgba(255,255,255,.12);border-radius:99px;margin:4px 0 8px}
.c-nowcard .c-meter i{display:block;height:100%;width:44%;background:var(--accent);border-radius:99px}
.c-nowcard span{font-size:9px;color:var(--muted)}
.c-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px}
.c-tile{position:relative;min-height:260px;border-radius:18px;overflow:hidden;cursor:pointer;isolation:isolate}
.c-tile .cover{position:absolute;inset:0;border-radius:0}
.c-tile:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.72),transparent 55%)}
.c-tile-copy{position:absolute;z-index:2;left:18px;right:18px;bottom:17px}
.c-tile-copy .ptype{color:var(--accent);font-size:8px}
.c-tile-copy h3{font-size:24px;line-height:1.05;letter-spacing:-.9px;margin:7px 0 6px}
.c-tile-copy span{font-size:9px;color:rgba(255,255,255,.72)}
.c-tile:hover .cover{transform:scale(1.025);transition:transform .35s}

      <div class="c-shelfhead"><h3>今晚的顺序</h3><span>3 集 · 2 小时 19 分</span></div>
      <div class="c-grid">${EPISODES.slice(0,3).map((e,i)=>`<article class="c-tile" data-open-episode>${cover(e.cover,e.mark)}<div class="c-tile-copy"><div class="ptype">${String(i+1).padStart(2,'0')} · ${e.meta}</div><h3>${e.title}</h3><span>${e.show} · ${e.time}</span></div></article>`).join('')}</div>
      <div class="c-shelfhead"><h3>订阅里的其他节目</h3><span>2 个</span></div>
      <div class="c-grid">${SHOWS.slice(3).map(s=>`<article class="c-tile" style="min-height:180px">${cover(s.cover,s.mark)}<div class="c-tile-copy"><div class="ptype">${s.meta}</div><h3 style="font-size:19px">${s.name}</h3></div></article>`).join('')}</div>
    </div>
    <div class="c-bar">${cover(cont.cover,cont.mark)}<div class="copy"><strong>${cont.title}</strong><span>${cont.show} · 22:29 / 50:35</span></div><button class="btn">−15</button><button class="play">▶</button><button class="btn">+30</button><button class="btn">1.0×</button></div>
  </div>`;
}
function cTranscript() {
  const e = EPISODES[0];
  return `<div class="c-shell">
    <header class="c-top"><div class="c-brand"><span class="c-dot"></span>MyTranscript</div><nav><span>首页</span><span>播客库</span><b>字幕页</b><span>笔记</span></nav><div class="tiny" style="color:var(--muted)">NOW PLAYING</div></header>
    <div class="c-reader">
      <div class="c-art">${cover(e.cover,e.mark)}</div>
      <div class="c-side"><button title="文字稿">▤</button><button title="笔记">✎</button><button title="收藏">★</button><button title="设置">⚙</button></div>
      <div class="c-focus">
        <div class="ptype">${e.show} · S4E6 · 双语逐词</div>
        <h1>${e.title}</h1>
        <div class="c-cap">
          <p class="c-prev">And then the waiter asked if we wanted to start with something to share.</p>
          <div class="c-cap-current"><p>I remember thinking: this is going to be a very long conversation.</p><span>我记得当时想：这会是一场很长的对话。</span></div>
          <p class="c-next">Not because it was difficult, but because it was easy to keep going.</p>
        </div>
        <div class="c-focus-bar"><span class="time">22:29</span><div class="track"><i></i></div><span class="time">50:35</span><button class="play">▶</button><span class="tiny" style="color:var(--muted)">1.0× · 双语</span></div>
      </div>
    </div>
  </div>`;
}

const VARIANTS = {
  A: { name:'Studio Desk', short:'A', home:aHome, transcript:aTranscript },
  B: { name:'Editorial Ledger', short:'B', home:bHome, transcript:bTranscript },
  C: { name:'Focus Cinema', short:'C', home:cHome, transcript:cTranscript },
};
const ORDER = ['A','B','C'];
const params = new URLSearchParams(location.search);
const state = {
  variant: ORDER.includes((params.get('variant') || '').toUpperCase()) ? (params.get('variant') || 'A').toUpperCase() : 'A',
  page: params.get('page') === 'transcript' ? 'transcript' : 'home',
};

function syncURL() {
  const q = new URLSearchParams({ variant: state.variant, page: state.page });
  history.replaceState(null, '', location.pathname + '?' + q.toString() + location.hash);
}
function render() {
  const v = VARIANTS[state.variant];
  document.getElementById('stage').innerHTML = v[state.page]();
  document.getElementById('protoLabel').innerHTML = `<b>${v.short}</b> · ${v.name}`;
  document.querySelectorAll('.proto-pages button').forEach(b => b.classList.toggle('on', b.dataset.page === state.page));
  syncURL();
  document.body.dataset.variant = state.variant;
  document.body.dataset.page = state.page;
}
function cycle(step) {
  const i = ORDER.indexOf(state.variant);
  state.variant = ORDER[(i + step + ORDER.length) % ORDER.length];
  render();
}
document.querySelectorAll('.proto-pages button').forEach(btn => {
  btn.onclick = () => { state.page = btn.dataset.page; render(); };
});
document.querySelectorAll('.proto-variants button').forEach(btn => {
  btn.onclick = () => cycle(Number(btn.dataset.step));
});
document.addEventListener('click', (event) => {
  if (event.target.closest('[data-open-episode]')) { state.page = 'transcript'; render(); }
});
document.addEventListener('keydown', (event) => {
  const tag = (event.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || event.target.isContentEditable) return;
  if (event.key === 'ArrowLeft') { event.preventDefault(); cycle(-1); }
  if (event.key === 'ArrowRight') { event.preventDefault(); cycle(1); }
  if (event.key === '1') { state.page = 'home'; render(); }
  if (event.key === '2') { state.page = 'transcript'; render(); }
});
render();
</script>
</body>
</html>
