[package]
name = "mytranscript-desktop"
version = "0.1.0"
description = "MyTranscript desktop player (Windows)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio = { version = "1", features = ["time"] }
# 本地音频整集预转写要解 mp3/m4a/wav；只开需要的格式，避免拖进无关编解码器。
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "wav", "flac", "ogg", "vorbis", "pcm"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
# 全局字幕的 WASAPI 采集：COM 包装用 windows crate，热键继续用 windows-sys。
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
] }
# `#[implement]` 宏展开会引用 windows_core，必须作为直接依赖出现。
windows-core = "0.61"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
