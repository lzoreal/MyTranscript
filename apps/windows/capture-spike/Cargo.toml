[package]
name = "capture-spike"
version = "0.1.0"
edition = "2021"
description = "WASAPI loopback capture spike: system audio -> 16k mono -> sherpa ASR"

[dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
] }
serde_json = "1"
windows-core = "0.61"

[profile.release]
opt-level = "s"
