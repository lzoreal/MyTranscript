<header class="topbar" data-anchor="drag-top">
  <div class="crumb"><button class="rail-toggle" id="sidebarToggle" type="button" title="收起或展开侧栏" aria-label="收起或展开侧栏" aria-expanded="true"><svg class="btn-ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-panel"/></svg></button></div>
  <div class="skB-titlerow"><b id="crumbName">首页</b></div>
  <div class="top-actions">
    <div class="search-global"><span>⌕</span><input id="globalSearch" placeholder="搜索" aria-label="搜索我的播客和单集" autocomplete="off"></div>
    <button class="icon-btn" id="pluginMenuBtn" title="插件菜单" aria-label="插件菜单" aria-haspopup="menu" aria-expanded="false" hidden><svg class="btn-ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-more"/></svg></button>
    <button class="icon-btn" id="themeTopBtn" title="切换主题" aria-label="切换主题"><svg class="btn-ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-theme"/></svg></button>
    <button class="icon-btn" id="settingsTopBtn" title="设置" aria-label="设置"><svg class="btn-ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-settings"/></svg></button>
  </div>
  <div class="skB-wctl" data-anchor="window-controls"></div>
  <div class="plugin-menu-pop" id="pluginMenuPop" role="menu" aria-label="插件菜单" hidden></div>
</header>
