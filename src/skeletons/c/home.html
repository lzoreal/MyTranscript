<section class="page active" id="page-home">
  <div id="customHomeMount" class="ct-home-mount" hidden></div>
  <div class="skC-head">
    <div class="skC-head-l">
      <div class="skC-eyebrow">PERSONAL PODCAST LEDGER</div>
      <h1>Listen<span class="skC-dot">.</span> Read<span class="skC-dot">.</span></h1>
    </div>
    <div class="skC-head-r">
      <div class="skC-readout"><span class="skC-k">日期</span><b id="ledgerDate">—</b></div>
      <div class="skC-readout"><span class="skC-k">在架</span><b id="heroSubCount">—</b><span class="skC-u">节目</span></div>
    </div>
  </div>
  <div class="skC-searchbar"><span class="skC-sl">⌕</span><input id="heroSearch" placeholder="在播客、单集和全部文字稿里检索…" aria-label="搜索我的播客和单集" autocomplete="off"><button id="heroSearchBtn" type="button" aria-label="搜索">RUN</button></div>
  <div class="plugin-slot" data-plugin-slot="home.hero.after"></div>

  <div class="skC-grid">
    <section class="skC-panel skC-panel-continue">
      <header class="skC-panelhead"><h3>继续收听</h3><small id="continueHint"></small></header>
      <div id="homeContinue"></div>
      <div class="plugin-slot" data-plugin-slot="home.continue.actions"></div>
      <div id="homeOnboard" class="home-onboard" hidden></div>
    </section>

    <section class="skC-panel">
      <header class="skC-panelhead"><h3>最近更新</h3><small id="homeRecentCount"></small></header>
      <div id="homeRecent"></div>
    </section>

    <section class="skC-panel skC-panel-pods">
      <header class="skC-panelhead"><h3>推荐播客</h3><small>编辑精选</small></header>
      <div class="pod-grid" id="homeRecommended"></div>
    </section>

    <section class="skC-panel skC-panel-stats">
      <header class="skC-panelhead"><h3>本周读数</h3><small>LOCAL</small></header>
      <div class="grid three" id="homeStats"></div>
      <p class="skC-note">数字来自本机收听记录与词级时间轴；断网时仍可读已有文字稿。</p>
    </section>
  </div>
</section>
