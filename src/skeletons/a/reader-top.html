<div class="reader-top-actions skA-top" id="readerTop">
  <div class="skA-back"><button class="reader-back" id="readerBack" type="button">← <span>主页</span></button></div>
  <div class="skA-mid"><span class="skA-kicker">READING</span></div>
  <div class="reader-top-right skA-right" data-anchor="reader-controls">
    <button class="reader-rail-btn" id="seriesRailBtn" type="button" title="剧集栏" aria-label="剧集栏"><svg class="btn-ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-queue"/></svg></button>
    <button class="reader-rail-btn" id="notesRailBtn" type="button" title="笔记栏" aria-label="笔记栏"><svg class="btn-ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-note"/></svg></button>
    <button class="reader-rail-btn" id="intensiveShowBtn" type="button" title="精听四步" aria-expanded="false" aria-label="精听四步"><svg class="btn-ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-headphones"/></svg></button>
    <button class="reader-rail-btn" id="clipNowBtn" type="button" title="摘录当前句" aria-label="摘录当前句"><svg class="btn-ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-distill"/></svg></button><span class="reader-show-pill" id="readerShowPill">NOW PLAYING</span>

</div>
