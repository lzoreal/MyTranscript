<section class="page active" id="page-home">
  <div id="customHomeMount" class="ct-home-mount" hidden></div>
  <div class="skA-head">
    <div class="skA-head-copy">
      <div class="skA-eyebrow">PERSONAL PODCAST LEDGER · <span id="ledgerDate">—</span></div>
      <h1>Listen. <em>Read.</em></h1>
      <p class="skA-sub">订阅、进度、文字稿排在同一张版面上。<b id="heroSubCount">—</b> 个节目在架上。</p>
    </div>
    <div class="skA-search"><span aria-hidden="true">⌕</span><input id="heroSearch" placeholder="搜索播客、单集或文字稿…" aria-label="搜索我的播客和单集" autocomplete="off"><button id="heroSearchBtn" type="button" aria-label="搜索">↩</button></div>
  </div>
  <div class="plugin-slot" data-plugin-slot="home.hero.after"></div>
  <div class="skA-cols">
    <section class="skA-card skA-card-continue">
      <div class="skA-cardhead"><h3>继续收听</h3><small id="continueHint"></small></div>
      <div id="homeContinue"></div>
      <div class="plugin-slot" data-plugin-slot="home.continue.actions"></div>
      <div class="skA-editpick">今日编辑选择：从上次停下的地方继续；需要精读时，再打开右侧的剧集栏与笔记栏。</div>
      <div id="homeOnboard" class="home-onboard" hidden></div>
    </section>
    <section class="skA-card skA-card-feed">
      <div class="skA-cardhead"><h3>最近更新</h3><small id="homeRecentCount"></small></div>
      <div id="homeRecent" class="skA-rows"></div>
    </section>
  </div>
  <div class="skA-bottom">
    <section class="skA-card skA-card-pods">
      <div class="skA-cardhead"><h3>推荐播客</h3><small>编辑精选</small></div>
      <div class="pod-grid" id="homeRecommended"></div>
    </section>
    <div class="grid three" id="homeStats"></div>
  </div>
</section>
